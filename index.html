<html lang="he" dir="rtl" data-theme="light">
<head>

<style>
:root{
  --bg:#F5F5F5;
  --card:#FFFFFF;
  --line:#E4E4E4;
  --ink:#111111;
  --mut:#5F5F5F;
  --acc:#2563EB;
  --on:#FFFFFF;
  --soft:#E6EDFB;
  --chip:#EFEFEF;
  --bad:#B3261E;
  --badsoft:#FBEAE7;
  --field:#CFCFCF;
  color-scheme:light;

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 28px}
#nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 8px}

#nav button.on{color:var(--acc);background:var(--soft)}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--bg);margin:-20px -20px 8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.topbar .lnk{display:flex;align-items:center;gap:6px;min-width:64px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h1{margin:0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.4px}
.h2{margin:0;font-size:19px;font-weight:600}

.btn:disabled{opacity:.45;cursor:default}

.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}

.sh{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;box-shadow:0 -8px 28px rgba(0,0,0,.14)}

<script type="module">

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const svg = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const COLORS = ['#E0E0E0', '#E8E4D8', '#E2E6EE', '#EEE2E0'];
const COLOR_NAMES = ['אפור', 'חול', 'כחול בהיר', 'ורוד עדין'];
const KINDS = [['flight', 'טיסה'], ['stay', 'לינה'], ['fun', 'אטרקציה'], ['other', 'אחר']];
const KIND_LABEL = { flight: 'טיסה', stay: 'לינה', fun: 'אטרקציה', other: 'אחר' };
const CATS = [
  ['restaurants', 'מסעדות'],
  ['gas stations', 'תחנות דלק'],
  ['supermarkets', 'סופרמרקטים'],
  ['cafes', 'בתי קפה'],
  ['pharmacies', 'בתי מרקחת'],
  ['parking', 'חניונים']
];
const ROUND = 10;
const QUESTION_SEC = 35;
const LOCAL_USER_KEY = 'family_trip_uid_v1';
const LOCAL_LOCK_KEY = 'family_trip_profile_locked_v1';

let uid = localStorage.getItem(LOCAL_USER_KEY);
if (!uid) {
  uid = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  localStorage.setItem(LOCAL_USER_KEY, uid);
}

function getAdminUid() {
  if (S.trip && S.trip.adminUid && S.members[S.trip.adminUid]) return S.trip.adminUid;
  const keys = Object.keys(S.members || {});
  return keys.length ? keys[0] : S.uid;
}

function isGroupAdmin() {
  return Boolean(S.members && S.members[S.uid]) && getAdminUid() === S.uid;
}

const TQ = [
  { cat: 'כדורגל', q: 'איזו מדינה זכתה במונדיאל 2022?', o: ['צרפת', 'ארגנטינה', 'קרואטיה', 'ברזיל'], a: 1 },
  { cat: 'כדורגל', q: 'מי השחקן עם הכי הרבה כדורי זהב בהיסטוריה?', o: ['כריסטיאנו רונאלדו', 'מישל פלטיני', 'ליונל מסי', 'יוהאן קרויף'], a: 2 },
  { cat: 'אולימפיאדה', q: 'באיזו עיר נערכה אולימפיאדת הקיץ של 2016?', o: ['לונדון', 'ריו דה ז׳נירו', 'בייג׳ינג', 'טוקיו'], a: 1 },
  { cat: 'טניס', q: 'כמה תארי גרנד סלאם ביחידים זכה בהם רפאל נדאל?', o: ['20', '22', '24', '18'], a: 1 },
  { cat: 'כדורסל', q: 'עם איזו קבוצה זכה מייקל ג׳ורדן בשש אליפויות NBA?', o: ['לוס אנג׳לס לייקרס', 'בוסטון סלטיקס', 'שיקגו בולס', 'דטרויט פיסטונס'], a: 2 },
  { cat: 'כדורגל', q: 'איזו מדינה זכתה בהכי הרבה גביעי עולם בגברים?', o: ['גרמניה', 'איטליה', 'ארגנטינה', 'ברזיל'], a: 3 },
  { cat: 'ספורט ישראלי', q: 'כמה פעמים זכתה מכבי תל אביב ביורוליג בכדורסל?', o: ['4', '5', '6', '7'], a: 2 },
  { cat: 'כדורגל', q: 'באיזה מונדיאל הבקיע מראדונה את ״יד האלוהים״?', o: ['1982', '1986', '1990', '1994'], a: 1 },
  { cat: 'אתלטיקה', q: 'מי מחזיק בשיא העולם ב-100 מטר גברים?', o: ['טייסון גיי', 'יוהאן בלייק', 'יוסיין בולט', 'אסאפה פאוול'], a: 2 },
  { cat: 'אתלטיקה', q: 'מה אורכו המדויק של מרתון?', o: ['40 ק״מ', '42.195 ק״מ', '45 ק״מ', '38.5 ק״מ'], a: 1 },
  { cat: 'טניס', q: 'על איזה משטח משחקים ברולאן גארוס?', o: ['דשא', 'מגרש קשיח', 'חימר', 'פרקט'], a: 2 },
  { cat: 'ספורט ישראלי', q: 'באיזו שנה זכה גל פרידמן במדליית זהב אולימפית בגלישת רוח?', o: ['2000', '2004', '2008', '2012'], a: 1 },
  { cat: 'ספורט ישראלי', q: 'באיזה ענף זכתה לינוי אשרם בזהב אולימפי?', o: ['התעמלות אמנותית', 'שחייה', 'ג׳ודו', 'התעמלות מכשירים'], a: 0 },
  { cat: 'כדורגל', q: 'באיזו מדינה נערך מונדיאל 2018?', o: ['רוסיה', 'ברזיל', 'קטאר', 'גרמניה'], a: 0 },
  { cat: 'כדורגל', q: 'מי היה מלך השערים של מונדיאל 2022?', o: ['ליונל מסי', 'קיליאן אמבפה', 'אוליבייה ז׳ירו', 'חוליאן אלברס'], a: 1 },
  { cat: 'כדורגל', q: 'איזו קבוצה זכתה בליגת האלופות הכי הרבה פעמים?', o: ['ברצלונה', 'מילאן', 'ריאל מדריד', 'ליברפול'], a: 2 },
  { cat: 'כדורסל', q: 'איזו קבוצה זכתה באליפות ה-NBA ב-2023?', o: ['מיאמי היט', 'דנבר נאגטס', 'בוסטון סלטיקס', 'גולדן סטייט ווריורס'], a: 1 },
  { cat: 'כדורסל', q: 'מי מחזיק בשיא הנקודות בכל הזמנים ב-NBA?', o: ['קארים עבדול ג׳אבר', 'מייקל ג׳ורדן', 'לברון ג׳יימס', 'קארל מאלון'], a: 2 },
  { cat: 'טניס', q: 'על איזה משטח משחקים בווימבלדון?', o: ['חימר', 'דשא', 'מגרש קשיח', 'פרקט'], a: 1 },
  { cat: 'פורמולה 1', q: 'איזו קבוצה מזוהה עם הצבע האדום ועם הסוס הקופץ?', o: ['מקלארן', 'מרצדס', 'פרארי', 'רד בול'], a: 2 }
];

function optOrder(qi) {
  let a = [0, 1, 2, 3], x = Math.imul(qi + 1, 2654435761) >>> 0;
  for (let i = 3; i > 0; i--) {
    x = (Math.imul(x, 1664525) + 1013904223) >>> 0;
    const j = x % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let PERM = null;
function qIndex(p, seedStr) {
  if (!PERM || PERM.length !== TQ.length) {
    let h = 2166136261;
    const str = String(seedStr || 'family');
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0;
    const rnd = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    PERM = TQ.map((_, k) => k);
    for (let i = PERM.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [PERM[i], PERM[j]] = [PERM[j], PERM[i]];
    }
  }
  return PERM[(p.round * ROUND + p.q) % PERM.length];
}

const S = {
  loaded: false,
  uid,
  tab: 'home',
  day: null,
  filter: 'all',
  mapMode: 'fam',
  selectedMember: null,
  cat: 'restaurants',
  trip: null,
  days: [],
  stops: [],
  tickets: [],
  members: {},
  locs: {},
  scores: {},
  prog: null,
  tvGame: null,
  geo: '',
  tv: 'lobby',
  tvSec: QUESTION_SEC,
  sos: {},
  sosAsk: false,
  sosBusy: false,
  gopen: {},
  ob: { step: 0, name: '', color: 0, loc: '' },
  resetScroll: false
};

let raf = 0, sheetCfg = null, watchId = null, lastPush = 0, pushBusy = false;
let tvInterval = null, tvAdvanceTimeout = null;
let findMyMap = null, findMyMarkers = {};
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const normalizeArr = val => Array.isArray(val) ? val : (val && typeof val === 'object' ? Object.values(val) : []);

onValue(ROOM_REF, snap => {
  const d = snap.val() || {};
  S.loaded = true;
  S.trip = d.trip || null;
  S.days = normalizeArr(d.days);
  S.stops = normalizeArr(d.stops);
  S.tickets = normalizeArr(d.tickets);
  S.members = d.members || {};
  S.locs = d.locs || {};
  S.scores = d.scores || {};
  S.prog = (d.prog && d.prog[S.uid]) ? d.prog[S.uid] : S.prog;
  S.tvGame = d.triviaGame || null;
  S.sos = d.sos || {};
  const myLoc = S.locs[S.uid];
  if (myLoc && myLoc.on && !watchId) startLocWatch(true);
  draw();
}, err => {
  S.loaded = true;
  draw();
  toast('שגיאת חיבור לענן: ' + (err?.message || 'בדוק כללי גישה'));
});

function syncRoom(patch) {
  return update(ROOM_REF, patch).catch(e => {
    toast('לא ניתן לשמור לענן: ' + (e?.message || 'שגיאה'));
  });
}

const draw = () => {
  if (!raf) raf = requestAnimationFrame(() => {
    raf = 0;
    render();
    if (S.resetScroll) { S.resetScroll = false; const v = $('#view'); if (v) v.scrollTop = 0; }
  });
};

let toastTimer;
const toast = m => {
  clearTimeout(toastTimer);
  const b = $('#toastbox');
  if (!b) return;
  b.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`;
  toastTimer = setTimeout(() => { b.innerHTML = ''; }, 3200);
};

const av = (m, s) => `<div class="av${s ? ' s' : ''}" style="background:${COLORS[m?.color || 0]}" aria-hidden="true">${esc((m?.name || '?').trim().slice(0, 1))}</div>`;
const sortedDays = () => [...S.days].sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0));
const sortedStops = d => S.stops.filter(x => x.dayId === d).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99') || (a.order || 0) - (b.order || 0));

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'short' });
}

function ago(ts) {
  if (!ts) return 'לא שותף';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'עודכן הרגע';
  if (m < 60) return `לפני ${m} דק׳`;
  const h = Math.round(m / 60);
  return h < 24 ? `לפני ${h} שע׳` : `לפני ${Math.round(h / 24)} ימים`;
}

function calcDistKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function fmtDistFromMe(l) {
  const me = S.locs[S.uid];
  if (!me || typeof me.lat !== 'number' || typeof me.lng !== 'number') return '';
  const km = calcDistKm(me.lat, me.lng, l.lat, l.lng);
  if (km < 0.05) return 'ממש לידך';
  if (km < 1) return `במרחק ${Math.round(km * 1000)} מ׳`;
  return `במרחק ${km.toFixed(1)} ק״מ`;
}

function coords(s) {
  if (s && typeof s.lat === 'number' && typeof s.lng === 'number' && !isNaN(s.lat) && !isNaN(s.lng)) {
    return `${s.lat.toFixed(6)},${s.lng.toFixed(6)}`;
  }
  return '';
}

function placeUrl(s) {
  const ll = coords(s), q = encodeURIComponent(s.place || s.title || '');
  return ll ? `https://maps.apple.com/?q=${q || ll}&ll=${ll}` : `https://maps.apple.com/?q=${q}`;
}

function navUrl(s, appName) {
  const ll = coords(s), q = encodeURIComponent(s.place || s.title || '');
  if (appName === 'waze') return ll ? `https://waze.com/ul?ll=${ll}&navigate=yes` : `https://waze.com/ul?q=${q}&navigate=yes`;
  if (appName === 'google') return `https://www.google.com/maps/dir/?api=1&destination=${ll || q}`;
  return ll ? `https://maps.apple.com/?daddr=${ll}` : `https://maps.apple.com/?daddr=${q}`;
}

function nearUrl(cat, appName) {
  const l = S.locs[S.uid], has = l && typeof l.lat === 'number' && typeof l.lng === 'number';
  const q = encodeURIComponent(cat);
  if (appName === 'waze') return has ? `https://waze.com/ul?ll=${l.lat},${l.lng}&q=${q}` : `https://waze.com/ul?q=${q}`;
  if (appName === 'google') return has ? `https://www.google.com/maps/search/?api=1&query=${q}&center=${l.lat},${l.lng}` : `https://www.google.com/maps/search/?api=1&query=${q}`;
  return has ? `https://maps.apple.com/?q=${q}&sll=${l.lat},${l.lng}` : `https://maps.apple.com/?q=${q}`;
}

function nextStop() {
  const ds = sortedDays();
  if (!ds.length) return null;
  const now = new Date(), iso = now.toISOString().slice(0, 10), hhmm = pad(now.getHours()) + ':' + pad(now.getMinutes());
  for (const d of ds) {
    if (d.date && d.date < iso) continue;
    for (const s of sortedStops(d.id)) {
      if (d.date === iso && s.time && s.time < hhmm) continue;
      return { stop: s, day: d };
    }
  }
  for (const d of ds) {
    const ss = sortedStops(d.id);
    if (ss.length) return { stop: ss[0], day: d };
  }
  return null;
}

function countdown(trip) {
  if (!trip || !trip.start) return '';
  const a = new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00');
  const b = new Date(trip.start + 'T00:00:00');
  const e = trip.end ? new Date(trip.end + 'T00:00:00') : b;
  const n = Math.round((b - a) / 86400000);
  if (n > 1) return `בעוד ${n} ימים`;
  if (n === 1) return 'מתחיל מחר';
  if (a <= e) return 'בטיול עכשיו';
  return 'הטיול הסתיים';
}

function pushLoc(pos) {
  const now = Date.now();
  if (pushBusy || now - lastPush < 10000) return;
  pushBusy = true;
  const locData = {
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    acc: Math.round(pos.coords.accuracy || 0),
    at: now,
    on: true
  };
  S.locs[S.uid] = locData;
  S.geo = '';
  syncRoom({ [`locs/${S.uid}`]: locData }).finally(() => {
    lastPush = Date.now();
    pushBusy = false;
    draw();
  });
}

function startLocWatch(silent) {
  if (!navigator.geolocation) {
    S.geo = 'המכשיר לא תומך בשיתוף מיקום';
    draw();
    return;
  }
  if (watchId) return;
  const onErr = e => {
    S.geo = e && e.code === 1 ? 'ההרשאה למיקום נדחתה בהגדרות המכשיר' : 'לא הצלחנו לאתר מיקום כרגע';
    if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    const offData = { ...(S.locs[S.uid] || {}), on: false };
    S.locs[S.uid] = offData;
    syncRoom({ [`locs/${S.uid}`]: offData });
    draw();
  };
  navigator.geolocation.getCurrentPosition(p => {
    pushLoc(p);
    if (!silent) toast('המיקום שלך משותף עם המשפחה');
  }, onErr, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
  watchId = navigator.geolocation.watchPosition(pushLoc, onErr, { enableHighAccuracy: false, maximumAge: 15000, timeout: 15000 });
}

function stopLocWatch() {
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  S.geo = '';
  const offData = { ...(S.locs[S.uid] || {}), on: false };
  S.locs[S.uid] = offData;
  syncRoom({ [`locs/${S.uid}`]: offData });
  draw();
  toast('שיתוף המיקום הופסק');
}

const navItems = [
  ['home', 'היום', 'home'],
  ['route', 'מסלול', 'route'],
  ['map', 'מצא את', 'pin'],
  ['tickets', 'כרטיסים', 'ticket'],
  ['more', 'עוד', 'more']
];

function render() {
  const me = S.members[S.uid];
  const v = $('#view'), n = $('#nav');
  if (!S.loaded) {
    n.style.display = 'none';
    v.innerHTML = `<div class="stack" style="justify-content:center;align-items:center;min-height:100%;text-align:center">
      <div class="h2">מתחבר לטיול המשפחתי...</div>
      <div class="small">טוען נתונים חיים מהענן</div>
    </div>`;
    return;
  }
  if (!me) {
    n.style.display = 'none';
    v.innerHTML = renderOnboarding();
    return;
  }
  n.style.display = 'flex';
  n.innerHTML = navItems.map(([id, label, icon]) => `<button type="button" class="${S.tab === id ? 'on' : ''}" data-tab="${id}">${svg(icon, 22)}<span>${label}</span></button>`).join('');

  let html = '';
  if (S.tab === 'home') html = renderHome();
  else if (S.tab === 'route') html = S.day ? renderDay(S.day) : renderRoute();
  else if (S.tab === 'map') html = renderMap();
  else if (S.tab === 'tickets') html = renderTickets();
  else if (S.tab === 'trivia') html = renderTrivia();
  else html = renderMore();

  v.innerHTML = renderSosBanner() + html;
  if (S.tab === 'map' && S.mapMode === 'fam') {
    requestAnimationFrame(initFindMyMap);
  }
}

      </div>
    </div>`;
  }
  if (o.step === 1) {
    return `<div class="stack" style="justify-content:space-between;min-height:100%">
      <div class="stack" style="margin-top:32px">
        <div class="row">${dots}</div>
        <h1 class="h1">שיתוף מיקום עם המשפחה</h1>
        <p class="sub">כך כולם רואים איפה כל אחד נמצא בזמן הטיול. אפשר להפעיל או לכבות בכל רגע.</p>
        <div class="card stack-s">
          <div class="h2">פרטיות ושליטה מלאה</div>

        <button type="button" class="btn" id="ob-loc-yes">הפעל שיתוף מיקום</button>

      </div>

  return `<div class="stack" style="justify-content:space-between;min-height:100%">
    <div class="stack" style="margin-top:32px">
      <div class="row">${dots}</div>
      <h1 class="h1">הכול מוכן, ${esc(o.name)}!</h1>
      <p class="sub">${S.trip ? `הטיול ״${esc(S.trip.title)}״ כבר מחכה לך בפנים.` : 'אפשר ליצור את הטיול המשפחתי או להוסיף ימים ותחנות.'}</p>
    </div>
    <button type="button" class="btn" id="ob-done">כניסה לאפליקציה</button>
  </div>`;
}

          <div style="font-weight:700;font-size:18px">התראת SOS מ-${esc(m.name)}</div>

        <a class="mini o" style="flex:1;background:#FFFFFF;color:#111111;border:0" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener noreferrer">Google Maps</a>

}

    <div class="card stack-s">

  const d = S.days.find(x => x.id === dayId);
  if (!d) { S.day = null; return renderRoute(); }
  const allStops = sortedStops(dayId);
  const stops = S.filter === 'all' ? allStops : allStops.filter(s => s.kind === S.filter);

  return `<div class="stack">
    <div class="topbar">
      <button type="button" class="lnk" id="back-route">${svg('back', 18)} מסלול</button>

  </div>`;
}

function initFindMyMap() {
  const el = document.getElementById('findmy-map');
  if (!el || typeof L === 'undefined') return;
  if (findMyMap) {
    findMyMap.remove();
    findMyMap = null;
    findMyMarkers = {};
  }
  const ms = Object.entries(S.members);
  const pinned = ms
    .map(([id, m]) => ({ id, m, l: S.locs[id] }))
    .filter(({ l }) => l && typeof l.lat === 'number' && typeof l.lng === 'number');

  const center = pinned.length ? [pinned[0].l.lat, pinned[0].l.lng] : [32.0853, 34.7818];
  const map = L.map('findmy-map', { zoomControl: true }).setView(center, pinned.length ? 14 : 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const bounds = [];
  pinned.forEach(({ id, m, l }) => {
    const initial = esc((m?.name || '?').trim().slice(0, 1));
    const bg = COLORS[m?.color || 0];
    const isLive = Boolean(l.on);
    const icon = L.divIcon({
      className: '',
      html: `<div class="fm-pin${isLive ? '' : ' off'}" style="background:${bg}">${initial}${isLive ? '<span class="fm-dot"></span>' : ''}</div>`,
      iconSize: [38, 38],
      iconAnchor: [19, 19]
    });
    const marker = L.marker([l.lat, l.lng], { icon }).addTo(map);
    const dist = id === S.uid ? 'המיקום שלך' : fmtDistFromMe(l);
    marker.bindPopup(`
      <div style="text-align:right;font-family:Heebo,sans-serif;min-width:150px">
        <div style="font-weight:700;font-size:15px">${esc(m?.name || 'בן משפחה')}</div>
        <div style="font-size:12px;color:#555;margin:2px 0 8px">${isLive ? ago(l.at) : 'מיקום אחרון • ' + ago(l.at)}${dist ? ' • ' + dist : ''}</div>
        <div style="display:flex;gap:6px">
          <a href="https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes" target="_blank" rel="noopener noreferrer" style="flex:1;background:#2563EB;color:#fff;padding:6px 8px;border-radius:8px;text-align:center;font-size:12px;font-weight:600">Waze</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener noreferrer" style="flex:1;background:#EFEFEF;color:#111;padding:6px 8px;border-radius:8px;text-align:center;font-size:12px;font-weight:600">Google</a>
        </div>
      </div>
    `);
    marker.on('click', () => {
      S.selectedMember = id;
    });

    bounds.push([l.lat, l.lng]);

  if (S.selectedMember && findMyMarkers[S.selectedMember]) {
    const sel = S.locs[S.selectedMember];

      map.setView([sel.lat, sel.lng], 16);

    }
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [44, 44], maxZoom: 15 });
  }
  findMyMap = map;
}

function stopTriviaTimers() {
  if (tvInterval) { clearInterval(tvInterval); tvInterval = null; }
  if (tvAdvanceTimeout) { clearTimeout(tvAdvanceTimeout); tvAdvanceTimeout = null; }
}

function getTriviaSecLeft(g) {
  if (!g || g.status !== 'play') return QUESTION_SEC;
  if (g.ans !== null && g.ans !== undefined) return 0;
  const elapsed = Math.floor((Date.now() - (g.turnStartedAt || Date.now())) / 1000);
  return Math.max(0, QUESTION_SEC - elapsed);
}

function startNewSharedGame(resetScores = false) {
  stopTriviaTimers();
  const order = Object.keys(S.members || {});
  if (!order.length) { toast('אין משתתפים בקבוצה'); return; }
  const round = (S.tvGame && typeof S.tvGame.round === 'number') ? S.tvGame.round + 1 : 0;
  const game = {
    status: 'play',
    round,
    q: 0,
    turnIdx: 0,
    order,
    activeUid: order[0],
    turnStartedAt: Date.now(),
    ans: null,
    lastResult: null,
    roundPts: {}
  };
  const patch = { triviaGame: game };
  if (resetScores) {
    const zeroScores = {};
    order.forEach(id => { zeroScores[id] = { pts: 0, ok: 0, tot: 0 }; });
    patch.scores = zeroScores;
  }
  S.tvGame = game;
  syncRoom(patch);
  ensureSharedTimer();
  draw();
}

function ensureSharedTimer() {
  const g = S.tvGame;
  if (!g || g.status !== 'play') {
    stopTriviaTimers();
    return;
  }
  if (!tvInterval) {
    tvInterval = setInterval(() => {
      const cur = S.tvGame;
      if (!cur || cur.status !== 'play') { stopTriviaTimers(); return; }
      const left = getTriviaSecLeft(cur);
      if (left <= 0 && (cur.ans === null || cur.ans === undefined)) {
        // Active player or host triggers timeout transition cleanly
        if (cur.activeUid === S.uid || isGroupAdmin()) {
          submitSharedAnswer(-1, true);
        }
      }
      if (S.tab === 'trivia') draw();
    }, 500);
  }
}

function submitSharedAnswer(chosenOrigIdx, isTimeout = false) {
  const g = S.tvGame;
  if (!g || g.status !== 'play') return;
  if (g.ans !== null && g.ans !== undefined) return;
  if (!isTimeout && g.activeUid !== S.uid) {
    toast('המתן לתור שלך');
    return;
  }

  const activeId = g.activeUid;
  const qi = qIndex({ round: g.round || 0, q: g.q || 0 }, S.trip?.id || 'family');
  const q = TQ[qi];
  const isOk = !isTimeout && chosenOrigIdx === q.a;

  const prev = S.scores[activeId] || { pts: 0, ok: 0, tot: 0 };
  const nextScore = isOk
    ? { pts: (prev.pts || 0) + 10, ok: (prev.ok || 0) + 1, tot: (prev.tot || 0) + 1 }
    : { pts: prev.pts || 0, ok: prev.ok || 0, tot: (prev.tot || 0) + 1 };

  const roundPts = { ...(g.roundPts || {}) };
  if (isOk) roundPts[activeId] = (roundPts[activeId] || 0) + 10;

  const updatedGame = {
    ...g,
    ans: chosenOrigIdx,
    roundPts,
    lastResult: {
      uid: activeId,
      ok: isOk,
      timeout: isTimeout,
      at: Date.now()
    }
  };
  S.tvGame = updatedGame;
  S.scores[activeId] = nextScore;
  syncRoom({
    triviaGame: updatedGame,
    [`scores/${activeId}`]: nextScore
  });
  draw();

  clearTimeout(tvAdvanceTimeout);
  tvAdvanceTimeout = setTimeout(() => {
    const latest = S.tvGame;
    if (!latest || latest.status !== 'play' || latest.q !== g.q) return;
    const validOrder = (latest.order || []).filter(id => S.members[id]);
    const pool = validOrder.length ? validOrder : Object.keys(S.members || {});
    if (latest.q + 1 >= ROUND || !pool.length) {
      const doneGame = { ...latest, status: 'done', ans: null };
      S.tvGame = doneGame;
      syncRoom({ triviaGame: doneGame });
      draw();
    } else {
      const nextTurnIdx = ((latest.turnIdx || 0) + 1) % pool.length;
      const nextGame = {
        ...latest,
        q: latest.q + 1,
        turnIdx: nextTurnIdx,
        order: pool,
        activeUid: pool[nextTurnIdx],
        turnStartedAt: Date.now(),
        ans: null
      };
      S.tvGame = nextGame;
      syncRoom({ triviaGame: nextGame });
      draw();
    }
  }, 1800);
}

function stopSharedGame() {
  stopTriviaTimers();
  const ended = S.tvGame ? { ...S.tvGame, status: 'lobby', ans: null } : null;
  S.tvGame = ended;
  syncRoom({ triviaGame: ended });
  draw();
}

  if (g && g.status === 'play') {
    ensureSharedTimer();
    const qi = qIndex({ round: g.round || 0, q: g.q || 0 }, S.trip?.id || 'family');
    const q = TQ[qi];
    const order = optOrder(qi);
    const secLeft = getTriviaSecLeft(g);
    const pct = Math.max(0, Math.min(100, (secLeft / QUESTION_SEC) * 100));
    const isMyTurn = g.activeUid === S.uid;

    return `<div class="stack">

            if (answered) {

            return `<button type="button" class="${cls}" data-ans="${origIdx}" ${disabled ? 'disabled' : ''}>

      ${mySos ? `<button type="button" class="btn2 danger" data-sos-clear="${esc(S.uid)}">בטל התראת SOS פעילה</button>`
        : S.sosAsk ? `<div class="stack-s">
          <div class="warn">לשלוח התראת חירום לכל המשפחה עכשיו?</div>
          <div class="row">
            <button type="button" class="btn" style="flex:1;background:var(--bad)" id="sos-confirm">כן, שלח SOS</button>
            <button type="button" class="btn2" style="flex:1" id="sos-cancel">ביטול</button>
          </div>
        </div>`
        : `<button type="button" class="btn2 danger" id="sos-trigger">הפעל התראת SOS</button>`}
    </div>
  </div>`;
}

function openSheet(html) {
  sheetCfg = true;
  $('#sheet').innerHTML = `<div class="ov" id="sh-ov"></div><div class="sh" role="dialog" aria-modal="true">${html}</div>`;
}
function closeSheet() {
  sheetCfg = null;
  $('#sheet').innerHTML = '';
}

function showTripSheet() {
  const t = S.trip || {};
  openSheet(`
    <div class="between"><h2>פרטי הטיול</h2><button type="button" class="lnk" id="sh-close">${svg('x')}</button></div>
    <label class="fld">שם הטיול<input id="f-t-title" value="${esc(t.title || '')}" placeholder="לדוגמה: איטליה 2026"></label>
    <label class="fld">יעד<input id="f-t-dest" value="${esc(t.dest || '')}" placeholder="לדוגמה: אגם גארדה וונציה"></label>
    <div class="row">
      <label class="fld" style="flex:1">תאריך התחלה<input type="date" id="f-t-start" value="${esc(t.start || '')}"></label>
      <label class="fld" style="flex:1">תאריך סיום<input type="date" id="f-t-end" value="${esc(t.end || '')}"></label>
    </div>
    <button type="button" class="btn" id="save-trip">שמור טיול</button>
  `);
}

function showDaySheet(dayId) {
  const d = dayId ? S.days.find(x => x.id === dayId) : null;
  const nextNum = S.days.length + 1;
  openSheet(`
    <div class="between"><h2>${d ? 'עריכת יום' : 'יום חדש'}</h2><button type="button" class="lnk" id="sh-close">${svg('x')}</button></div>
    <label class="fld">כותרת היום<input id="f-d-title" value="${esc(d?.title || 'יום ' + nextNum)}" placeholder="יום 1 • נחיתה"></label>
    <label class="fld">תאריך<input type="date" id="f-d-date" value="${esc(d?.date || '')}"></label>
    <label class="fld">הערה ליום<input id="f-d-note" value="${esc(d?.note || '')}" placeholder="דגשים מיוחדים ליום זה"></label>
    <button type="button" class="btn" id="save-day" data-id="${esc(d?.id || '')}">שמור יום</button>
    ${d ? `<button type="button" class="btn2 danger" id="del-day" data-id="${esc(d.id)}">מחק יום</button>` : ''}
  `);
}

function showStopSheet(stopId) {
  const s = stopId ? S.stops.find(x => x.id === stopId) : null;
  openSheet(`
    <div class="between"><h2>${s ? 'עריכת תחנה' : 'תחנה חדשה'}</h2><button type="button" class="lnk" id="sh-close">${svg('x')}</button></div>
    <label class="fld">שם התחנה<input id="f-s-title" value="${esc(s?.title || '')}" placeholder="לדוגמה: הגעה למלון"></label>
    <div class="row">
      <label class="fld" style="flex:1">שעה<input type="time" id="f-s-time" value="${esc(s?.time || '')}"></label>
      <label class="fld" style="flex:1">סוג
        <select id="f-s-kind">${KINDS.map(([k, l]) => `<option value="${k}" ${(s?.kind || 'fun') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </label>
    </div>
    <label class="fld">מיקום / כתובת לניווט<input id="f-s-place" value="${esc(s?.place || '')}" placeholder="שם מקום או כתובת מדויקת"></label>
    <label class="fld">הערה<input id="f-s-note" value="${esc(s?.note || '')}" placeholder="פרטים נוספים"></label>
    <button type="button" class="btn" id="save-stop" data-id="${esc(s?.id || '')}">שמור תחנה</button>
    ${s ? `<button type="button" class="btn2 danger" id="del-stop" data-id="${esc(s.id)}">מחק תחנה</button>` : ''}
  `);
}

function showTicketSheet(ticketId) {
  const t = ticketId ? S.tickets.find(x => x.id === ticketId) : null;
  openSheet(`
    <div class="between"><h2>${t ? 'עריכת כרטיס' : 'כרטיס חדש'}</h2><button type="button" class="lnk" id="sh-close">${svg('x')}</button></div>
    <label class="fld">כותרת<input id="f-k-title" value="${esc(t?.title || '')}" placeholder="לדוגמה: טיסת אל על הלוך"></label>
    <div class="row">
      <label class="fld" style="flex:1">סוג
        <select id="f-k-kind">${KINDS.map(([k, l]) => `<option value="${k}" ${(t?.kind || 'flight') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      </label>
      <label class="fld" style="flex:1">מועד<input id="f-k-when" value="${esc(t?.when || '')}" placeholder="15.08 • 08:30"></label>
    </div>
    <label class="fld">מספר הזמנה / קוד<input id="f-k-code" value="${esc(t?.code || '')}" placeholder="ABC123"></label>
    <label class="fld">קישור למסמך / כרטיס<input type="url" id="f-k-link" value="${esc(t?.link || '')}" placeholder="https://..."></label>
    <label class="fld">הערה<input id="f-k-note" value="${esc(t?.note || '')}" placeholder="שער, מושבים או פרטים"></label>
    <button type="button" class="btn" id="save-ticket" data-id="${esc(t?.id || '')}">שמור כרטיס</button>
    ${t ? `<button type="button" class="btn2 danger" id="del-ticket" data-id="${esc(t.id)}">מחק כרטיס</button>` : ''}
  `);
}

function showProfileSheet() {
  const me = S.members[S.uid] || { name: '', color: 0 };
  openSheet(`
    <div class="between"><h2>עריכת פרופיל</h2><button type="button" class="lnk" id="sh-close">${svg('x')}</button></div>
    <label class="fld">שם תצוגה<input id="f-p-name" value="${esc(me.name)}"></label>
    <div class="fld">צבע
      <div class="row" style="margin-top:4px">${COLORS.map((c, i) => `<button type="button" data-p-col="${i}" style="width:44px;height:44px;border-radius:50%;background:${c};border:${(me.color || 0) === i ? '3px solid var(--acc)' : '1.5px solid var(--field)'}"></button>`).join('')}</div>
    </div>
    <button type="button" class="btn" id="save-profile" data-col="${me.color || 0}">שמור פרופיל</button>
  `);
}

document.addEventListener('input', e => {
  if (e.target.id === 'ob-name') {
    S.ob.name = e.target.value;
    const b = $('#ob-next0');
    if (b) b.disabled = !S.ob.name.trim();
  }
});

document.addEventListener('click', e => {
  const focusCard = e.target.closest('[data-focus-member]');
  if (focusCard && !e.target.closest('a, button')) {
    const mid = focusCard.dataset.focusMember;
    const l = S.locs[mid];
    if (l && typeof l.lat === 'number' && typeof l.lng === 'number') {
      S.selectedMember = mid;
      if (findMyMap) {
        findMyMap.setView([l.lat, l.lng], 16);
        if (findMyMarkers[mid]) findMyMarkers[mid].openPopup();
      }
      draw();
    }
    return;
  }

  const el = e.target.closest('button, a');
  if (!el) return;

  if (el.id === 'sh-ov' || el.id === 'sh-close') { closeSheet(); return; }

  if (el.dataset.obCol !== undefined) { S.ob.color = Number(el.dataset.obCol); draw(); return; }
  if (el.id === 'ob-next0') { if (S.ob.name.trim()) { S.ob.step = 1; draw(); } return; }
  if (el.id === 'ob-loc-yes') { S.ob.loc = 'yes'; startLocWatch(false); S.ob.step = 2; draw(); return; }
  if (el.id === 'ob-loc-no') { S.ob.loc = 'no'; S.ob.step = 2; draw(); return; }
  if (el.id === 'ob-done') {
    const alreadyLocked = localStorage.getItem(LOCAL_LOCK_KEY) === '1';
    if (alreadyLocked && S.members[S.uid]) {
      toast('כבר קיים פרופיל עבור מכשיר זה — ניתן לערוך אותו מתוך לשונית עוד');
      S.resetScroll = true;
      draw();
      return;
    }
    const memberObj = { name: S.ob.name.trim() || 'בן משפחה', color: S.ob.color, createdAt: Date.now() };
    S.members[S.uid] = memberObj;
    localStorage.setItem(LOCAL_LOCK_KEY, '1');
    const patch = { [`members/${S.uid}`]: memberObj };
    if (!S.trip?.adminUid && Object.keys(S.members).length === 1) {
      patch['trip/adminUid'] = S.uid;
    }
    syncRoom(patch);
    S.resetScroll = true;
    draw();
    return;
  }

  if (el.dataset.tab) {
    stopTriviaTimers();
    S.tab = el.dataset.tab;
    S.day = null;
    S.resetScroll = true;
    draw();
    return;
  }

  if (el.id === 'open-trip-sheet' || el.id === 'open-trip-sheet-2') { showTripSheet(); return; }
  if (el.id === 'save-trip') {
    const title = $('#f-t-title').value.trim();
    if (!title) { toast('נא להזין שם לטיול'); return; }
    const tripObj = {
      id: S.trip?.id || newId(),
      title,
      dest: $('#f-t-dest').value.trim(),
      start: $('#f-t-start').value,
      end: $('#f-t-end').value
    };
    S.trip = tripObj;
    syncRoom({ trip: tripObj });
    closeSheet();
    draw();
    toast('פרטי הטיול נשמרו');
    return;
  }

  if (el.id === 'add-day-btn') { showDaySheet(null); return; }
  if (el.dataset.openDay) { S.day = el.dataset.openDay; S.filter = 'all'; S.resetScroll = true; draw(); return; }
  if (el.id === 'back-route') { S.day = null; S.resetScroll = true; draw(); return; }
  if (el.dataset.editDay) { showDaySheet(el.dataset.editDay); return; }
  if (el.id === 'save-day') {
    const id = el.dataset.id;
    const title = $('#f-d-title').value.trim() || 'יום בטיול';
    const date = $('#f-d-date').value;
    const note = $('#f-d-note').value.trim();
    if (id) {
      const d = S.days.find(x => x.id === id);
      if (d) Object.assign(d, { title, date, note });
    } else {
      S.days.push({ id: newId(), num: S.days.length + 1, title, date, note });
    }
    syncRoom({ days: S.days });
    closeSheet();
    draw();
    toast('היום נשמר');
    return;
  }
  if (el.id === 'del-day') {
    const id = el.dataset.id;
    S.days = S.days.filter(x => x.id !== id);
    S.stops = S.stops.filter(x => x.dayId !== id);
    if (S.day === id) S.day = null;
    syncRoom({ days: S.days, stops: S.stops });
    closeSheet();
    draw();
    toast('היום נמחק');
    return;
  }

  if (el.dataset.filt) { S.filter = el.dataset.filt; draw(); return; }
  if (el.id === 'add-stop-btn') { showStopSheet(null); return; }
  if (el.dataset.editStop) { showStopSheet(el.dataset.editStop); return; }
  if (el.id === 'save-stop') {
    const id = el.dataset.id;
    const title = $('#f-s-title').value.trim();
    if (!title) { toast('נא להזין שם לתחנה'); return; }
    const payload = {
      title,
      time: $('#f-s-time').value,
      kind: $('#f-s-kind').value,
      place: $('#f-s-place').value.trim(),
      note: $('#f-s-note').value.trim()
    };
    if (id) {
      const s = S.stops.find(x => x.id === id);
      if (s) Object.assign(s, payload);
    } else {
      S.stops.push({ id: newId(), dayId: S.day, order: S.stops.length, ...payload });
    }
    syncRoom({ stops: S.stops });
    closeSheet();
    draw();
    toast('התחנה נשמרה');
    return;
  }
  if (el.id === 'del-stop') {
    const id = el.dataset.id;
    S.stops = S.stops.filter(x => x.id !== id);
    syncRoom({ stops: S.stops });
    closeSheet();
    draw();
    toast('התחנה נמחקה');
    return;
  }

  if (el.dataset.mm) { S.mapMode = el.dataset.mm; draw(); return; }
  if (el.id === 'fm-fit-all') { S.selectedMember = null; draw(); return; }
  if (el.dataset.cat) { S.cat = el.dataset.cat; draw(); return; }
  if (el.id === 'toggle-loc') {
    if (S.locs[S.uid]?.on) stopLocWatch();
    else startLocWatch(false);
    return;
  }

  if (el.id === 'add-ticket-btn') { showTicketSheet(null); return; }
  if (el.dataset.editTicket) { showTicketSheet(el.dataset.editTicket); return; }
  if (el.id === 'save-ticket') {
    const id = el.dataset.id;
    const title = $('#f-k-title').value.trim();
    if (!title) { toast('נא להזין כותרת לכרטיס'); return; }
    const payload = {
      title,
      kind: $('#f-k-kind').value,
      when: $('#f-k-when').value.trim(),
      code: $('#f-k-code').value.trim(),
      link: $('#f-k-link').value.trim(),
      note: $('#f-k-note').value.trim()
    };
    if (id) {
      const t = S.tickets.find(x => x.id === id);
      if (t) Object.assign(t, payload);
    } else {
      S.tickets.push({ id: newId(), ...payload });
    }
    syncRoom({ tickets: S.tickets });
    closeSheet();
    draw();
    toast('הכרטיס נשמר');
    return;
  }
  if (el.id === 'del-ticket') {
    const id = el.dataset.id;
    S.tickets = S.tickets.filter(x => x.id !== id);
    syncRoom({ tickets: S.tickets });
    closeSheet();
    draw();
    toast('הכרטיס נמחק');
    return;
  }
  if (el.dataset.copy) {
    navigator.clipboard?.writeText(el.dataset.copy);
    toast('הקוד הועתק');
    return;
  }

  if (el.id === 'tv-start' || el.id === 'tv-next-round') { startNewSharedGame(false); return; }
  if (el.id === 'tv-reset-scores') { startNewSharedGame(true); return; }
  if (el.id === 'tv-pause' || el.id === 'tv-back') { stopSharedGame(); return; }
  if (el.dataset.ans !== undefined) { submitSharedAnswer(Number(el.dataset.ans), false); return; }

  if (el.id === 'edit-profile') { showProfileSheet(); return; }
  if (el.dataset.pCol !== undefined) {
    const col = Number(el.dataset.pCol);
    const btn = $('#save-profile');
    if (btn) btn.dataset.col = col;
    document.querySelectorAll('[data-p-col]').forEach((b, i) => {
      b.style.border = i === col ? '3px solid var(--acc)' : '1.5px solid var(--field)';
    });
    return;
  }
  if (el.id === 'save-profile') {
    const name = $('#f-p-name').value.trim();
    if (!name) { toast('נא להזין שם'); return; }
    const col = Number(el.dataset.col || 0);
    const memberObj = { name, color: col };
    S.members[S.uid] = memberObj;
    syncRoom({ [`members/${S.uid}`]: memberObj });
    closeSheet();
    draw();
    toast('הפרופיל עודכן');
    return;
  }

  if (el.id === 'sos-trigger') { S.sosAsk = true; draw(); return; }
  if (el.id === 'sos-cancel') { S.sosAsk = false; draw(); return; }
  if (el.id === 'sos-confirm') {
    S.sosAsk = false;
    const sosObj = { active: true, at: Date.now(), name: S.members[S.uid]?.name || '' };
    S.sos[S.uid] = sosObj;
    startLocWatch(true);
    syncRoom({ [`sos/${S.uid}`]: sosObj });
    draw();
    toast('התראת SOS נשלחה למשפחה');
    return;
  }
  if (el.dataset.delMember) {
    if (!isGroupAdmin()) { toast('רק מנהל הקבוצה יכול למחוק משתמש'); return; }
    const targetId = el.dataset.delMember;
    if (targetId === S.uid) { toast('לא ניתן למחוק את הפרופיל שלך מכאן'); return; }
    const targetName = el.dataset.delName || 'המשתמש';
    delete S.members[targetId];
    delete S.locs[targetId];
    delete S.scores[targetId];
    delete S.sos[targetId];
    if (S.selectedMember === targetId) S.selectedMember = null;
    syncRoom({
      [`members/${targetId}`]: null,
      [`locs/${targetId}`]: null,
      [`scores/${targetId}`]: null,
      [`sos/${targetId}`]: null,
      [`prog/${targetId}`]: null
    });
    draw();
    toast(`המשתמש ${targetName} נמחק מהקבוצה`);
    return;
  }

  if (el.dataset.sosClear) {
    const k = el.dataset.sosClear;
    delete S.sos[k];
    syncRoom({ [`sos/${k}`]: null });
    draw();
    toast('התראת ה-SOS נסגרה');
    return;
  }
});

render();
</script>
</body>
</html>
