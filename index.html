  const n = String(name || '').trim().toLowerCase();

function findExistingMemberByName(membersObj, targetName) {
  const norm = String(targetName || '').trim().toLowerCase();

  const targetIsEric = isEricName(norm);

function optOrder(qi) {
  let a = [0, 1, 2, 3], x = Math.imul(qi + 1, 2654435761) >>> 0;
  for (let i = 3; i > 0; i--) {
    x = (Math.imul(x, 1664525) + 1013904223) >>> 0;
    const j = x % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let PERM = null;
function qIndex(p, seedStr) {
  if (!PERM || PERM.length !== TQ.length) {
    let h = 2166136261;
    const str = String(seedStr || 'family');
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0;
    const rnd = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    PERM = TQ.map((_, k) => k);
    for (let i = PERM.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [PERM[i], PERM[j]] = [PERM[j], PERM[i]];
    }
  }
  return PERM[(p.round * ROUND + p.q) % PERM.length];
}

onValue(ROOM_REF, snap => {
  const d = snap.val() || {};
  S.loaded = true;
  S.trip = d.trip || null;
  S.days = normalizeArr(d.days);
  S.stops = normalizeArr(d.stops);
  S.tickets = normalizeArr(d.tickets);
  S.members = d.members || {};
  S.locs = d.locs || {};
  S.scores = d.scores || {};
  S.tvGame = d.triviaGame || null;
  S.sos = d.sos || {};

  // Re-attach to existing profile if localStorage uid was reset on this phone
  if (!S.members[S.uid]) {
    const savedName = localStorage.getItem(LOCAL_NAME_KEY);
    if (savedName) {
      const matchedId = findExistingMemberByName(S.members, savedName);
      if (matchedId) {
        S.uid = matchedId;
        uid = matchedId;
        localStorage.setItem(LOCAL_USER_KEY, matchedId);
        localStorage.setItem(LOCAL_LOCK_KEY, '1');
      }
    }
  } else if (S.members[S.uid]?.name) {
    localStorage.setItem(LOCAL_NAME_KEY, S.members[S.uid].name);
  }

  // Ensure Eric is recorded as group admin in trip/adminUid
  const me = S.members[S.uid];
  if (me && isEricName(me.name) && S.trip && S.trip.adminUid !== S.uid) {
    S.trip.adminUid = S.uid;
    syncRoom({ 'trip/adminUid': S.uid });
  }

  S.prog = (d.prog && d.prog[S.uid]) ? d.prog[S.uid] : S.prog;
  const myLoc = S.locs[S.uid];
  if (myLoc && myLoc.on && !watchId) startLocWatch(true);
  draw();
}, err => {
  S.loaded = true;
  draw();
  toast('שגיאת חיבור לענן: ' + (err?.message || 'בדוק כללי גישה'));
});

function syncRoom(patch) {
  return update(ROOM_REF, patch).catch(e => {
    toast('לא ניתן לשמור לענן: ' + (e?.message || 'שגיאה'));
  });
}

const draw = () => {
  if (!raf) raf = requestAnimationFrame(() => {
    raf = 0;
    render();
    if (S.resetScroll) { S.resetScroll = false; const v = $('#view'); if (v) v.scrollTop = 0; }
  });
};

let toastTimer;
const toast = m => {
  clearTimeout(toastTimer);
  const b = $('#toastbox');
  if (!b) return;
  b.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`;
  toastTimer = setTimeout(() => { b.innerHTML = ''; }, 3200);
};

const av = (m, s) => `<div class="av${s ? ' s' : ''}" style="background:${COLORS[m?.color || 0]}" aria-hidden="true">${esc((m?.name || '?').trim().slice(0, 1))}</div>`;
const sortedDays = () => [...S.days].sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.num || 0) - (b.num || 0));
const sortedStops = d => S.stops.filter(x => x.dayId === d).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99') || (a.order || 0) - (b.order || 0));

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'short' });
}

function ago(ts) {
  if (!ts) return 'לא שותף';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'עודכן הרגע';
  if (m < 60) return `לפני ${m} דק׳`;
  const h = Math.round(m / 60);
  return h < 24 ? `לפני ${h} שע׳` : `לפני ${Math.round(h / 24)} ימים`;
}

function calcDistKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function fmtDistFromMe(l) {
  const me = S.locs[S.uid];
  if (!me || typeof me.lat !== 'number' || typeof me.lng !== 'number') return '';
  const km = calcDistKm(me.lat, me.lng, l.lat, l.lng);
  if (km < 0.05) return 'ממש לידך';
  if (km < 1) return `במרחק ${Math.round(km * 1000)} מ׳`;
  return `במרחק ${km.toFixed(1)} ק״מ`;
}

function coords(s) {
  if (s && typeof s.lat === 'number' && typeof s.lng === 'number' && !isNaN(s.lat) && !isNaN(s.lng)) {
    return `${s.lat.toFixed(6)},${s.lng.toFixed(6)}`;
  }
  return '';
}

function placeUrl(s) {
  const ll = coords(s), q = encodeURIComponent(s.place || s.title || '');
  return ll ? `https://maps.apple.com/?q=${q || ll}&ll=${ll}` : `https://maps.apple.com/?q=${q}`;
}

function navUrl(s, appName) {
  const ll = coords(s), q = encodeURIComponent(s.place || s.title || '');
  if (appName === 'waze') return ll ? `https://waze.com/ul?ll=${ll}&navigate=yes` : `https://waze.com/ul?q=${q}&navigate=yes`;
  if (appName === 'google') return `https://www.google.com/maps/dir/?api=1&destination=${ll || q}`;
  return ll ? `https://maps.apple.com/?daddr=${ll}` : `https://maps.apple.com/?daddr=${q}`;
}

function nearUrl(cat, appName) {
  const l = S.locs[S.uid], has = l && typeof l.lat === 'number' && typeof l.lng === 'number';
  const q = encodeURIComponent(cat);
  if (appName === 'waze') return has ? `https://waze.com/ul?ll=${l.lat},${l.lng}&q=${q}` : `https://waze.com/ul?q=${q}`;
  if (appName === 'google') return has ? `https://www.google.com/maps/search/?api=1&query=${q}&center=${l.lat},${l.lng}` : `https://www.google.com/maps/search/?api=1&query=${q}`;
  return has ? `https://maps.apple.com/?q=${q}&sll=${l.lat},${l.lng}` : `https://maps.apple.com/?q=${q}`;
}

function nextStop() {
  const ds = sortedDays();
  if (!ds.length) return null;
  const now = new Date(), iso = now.toISOString().slice(0, 10), hhmm = pad(now.getHours()) + ':' + pad(now.getMinutes());
  for (const d of ds) {
    if (d.date && d.date < iso) continue;
    for (const s of sortedStops(d.id)) {
      if (d.date === iso && s.time && s.time < hhmm) continue;
      return { stop: s, day: d };
    }
  }
  for (const d of ds) {
    const ss = sortedStops(d.id);
    if (ss.length) return { stop: ss[0], day: d };
  }
  return null;
}

function countdown(trip) {
  if (!trip || !trip.start) return '';
  const a = new Date(new Date().toISOString().slice(0, 10) + 'T00:00:00');
  const b = new Date(trip.start + 'T00:00:00');
  const e = trip.end ? new Date(trip.end + 'T00:00:00') : b;
  const n = Math.round((b - a) / 86400000);
  if (n > 1) return `בעוד ${n} ימים`;
  if (n === 1) return 'מתחיל מחר';
  if (a <= e) return 'בטיול עכשיו';
  return 'הטיול הסתיים';
}

function pushLoc(pos) {
  const now = Date.now();
  if (pushBusy || now - lastPush < 10000) return;
  pushBusy = true;
  const locData = {
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    acc: Math.round(pos.coords.accuracy || 0),
    at: now,
    on: true
  };
  S.locs[S.uid] = locData;
  S.geo = '';
  syncRoom({ [`locs/${S.uid}`]: locData }).finally(() => {
    lastPush = Date.now();
    pushBusy = false;
    draw();
  });
}

function startLocWatch(silent) {
  if (!navigator.geolocation) {
    S.geo = 'המכשיר לא תומך בשיתוף מיקום';
    draw();
    return;
  }
  if (watchId) return;
  const onErr = e => {
    S.geo = e && e.code === 1 ? 'ההרשאה למיקום נדחתה בהגדרות המכשיר' : 'לא הצלחנו לאתר מיקום כרגע';
    if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    const offData = { ...(S.locs[S.uid] || {}), on: false };
    S.locs[S.uid] = offData;
    syncRoom({ [`locs/${S.uid}`]: offData });
    draw();
  };
  navigator.geolocation.getCurrentPosition(p => {
    pushLoc(p);
    if (!silent) toast('המיקום שלך משותף עם המשפחה');
  }, onErr, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
  watchId = navigator.geolocation.watchPosition(pushLoc, onErr, { enableHighAccuracy: false, maximumAge: 15000, timeout: 15000 });
}

function stopLocWatch() {
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  S.geo = '';
  const offData = { ...(S.locs[S.uid] || {}), on: false };
  S.locs[S.uid] = offData;
  syncRoom({ [`locs/${S.uid}`]: offData });
  draw();
  toast('שיתוף המיקום הופסק');
}

const navItems = [
  ['home', 'היום', 'home'],
  ['route', 'מסלול', 'route'],
  ['map', 'מצא את', 'pin'],
  ['tickets', 'כרטיסים', 'ticket'],
  ['more', 'עוד', 'more']
];

function render() {
  const me = S.members[S.uid];
  const v = $('#view'), n = $('#nav');
  if (!S.loaded) {
    n.style.display = 'none';
    v.innerHTML = `<div class="stack" style="justify-content:center;align-items:center;min-height:100%;text-align:center">
      <div class="h2">מתחבר לטיול המשפחתי...</div>
      <div class="small">טוען נתונים חיים מהענן</div>
    </div>`;
    return;
  }
  if (!me) {
    n.style.display = 'none';
    v.innerHTML = renderOnboarding();
    return;
  }
  n.style.display = 'flex';
  n.innerHTML = navItems.map(([id, label, icon]) => `<button type="button" class="${S.tab === id ? 'on' : ''}" data-tab="${id}">${svg(icon, 22)}<span>${label}</span></button>`).join('');

  let html = '';
  if (S.tab === 'home') html = renderHome();
  else if (S.tab === 'route') html = S.day ? renderDay(S.day) : renderRoute();
  else if (S.tab === 'map') html = renderMap();
  else if (S.tab === 'tickets') html = renderTickets();
  else if (S.tab === 'trivia') html = renderTrivia();
  else html = renderMore();

  v.innerHTML = renderSosBanner() + html;
  if (S.tab === 'map' && S.mapMode === 'fam') {
    requestAnimationFrame(initFindMyMap);
  }
}

function renderOnboarding() {
  const o = S.ob;
  const dots = [0, 1, 2].map(i => `<span style="width:${i === o.step ? 24 : 8}px;height:8px;border-radius:4px;background:${i === o.step ? 'var(--acc)' : 'var(--field)'}"></span>`).join('');
  if (o.step === 0) {
    return `<div class="stack" style="justify-content:space-between;min-height:100%">
      <div class="stack" style="margin-top:32px">
        <div class="row">${dots}</div>
        <h1 class="h1">ברוכים הבאים לטיול המשפחתי</h1>
        <p class="sub">מקום אחד למסלול, מיקום חי, כרטיסים וטריוויה לנסיעות — מסונכרן בזמן אמת לכל המשפחה.</p>
      </div>
      <div class="stack-s">
        <label class="fld">מה השם שלך?
          <input id="ob-name" value="${esc(o.name)}" placeholder="לדוגמה: אריק, סיגל, ליאן..." autocomplete="given-name">
        </label>
        <div class="fld">בחר צבע לזיהוי
          <div class="row" style="margin-top:4px">${COLORS.map((c, i) => `<button type="button" data-ob-col="${i}" aria-label="${COLOR_NAMES[i]}" style="width:48px;height:48px;border-radius:50%;background:${c};border:${o.color === i ? '3px solid var(--acc)' : '1.5px solid var(--field)'}"></button>`).join('')}</div>
        </div>
        <button type="button" class="btn" id="ob-next0" style="margin-top:12px" ${o.name.trim() ? '' : 'disabled'}>המשך</button>
      </div>
    </div>`;
  }
  if (o.step === 1) {
    return `<div class="stack" style="justify-content:space-between;min-height:100%">
      <div class="stack" style="margin-top:32px">
        <div class="row">${dots}</div>
        <h1 class="h1">שיתוף מיקום עם המשפחה</h1>
        <p class="sub">כך כולם רואים איפה כל אחד נמצא בזמן הטיול. אפשר להפעיל או לכבות בכל רגע.</p>
        <div class="card stack-s">
          <div class="h2">פרטיות ושליטה מלאה</div>
          <div class="small">המיקום משותף רק עם חברי הטיול וניתן לעצירה בלחיצה אחת.</div>
        </div>
      </div>
      <div class="stack-s">
        <button type="button" class="btn" id="ob-loc-yes">הפעל שיתוף מיקום</button>
        <button type="button" class="btn2" id="ob-loc-no">לא עכשיו</button>
      </div>
    </div>`;
  }
  return `<div class="stack" style="justify-content:space-between;min-height:100%">
    <div class="stack" style="margin-top:32px">
      <div class="row">${dots}</div>
      <h1 class="h1">הכול מוכן, ${esc(o.name)}!</h1>
      <p class="sub">${S.trip ? `הטיול ״${esc(S.trip.title)}״ כבר מחכה לך בפנים.` : 'אפשר ליצור את הטיול המשפחתי או להוסיף ימים ותחנות.'}</p>
    </div>
    <button type="button" class="btn" id="ob-done">כניסה לאפליקציה</button>
  </div>`;
}

function renderSosBanner() {
  const entries = Object.entries(S.sos || {}).filter(([, v]) => v && v.active);
  if (!entries.length) return '';
  return entries.map(([k, v]) => {
    const m = S.members[k] || { name: v.name || 'בן משפחה' };
    const l = S.locs[k];
    const has = l && typeof l.lat === 'number' && typeof l.lng === 'number';
    return `<div class="sos-banner" role="alert">
      <div class="between">
        <div>
          <div style="font-weight:700;font-size:18px">התראת SOS מ-${esc(m.name)}</div>
          <div style="font-size:14px;opacity:.92">${has ? ago(l.at) : 'אין מיקום חי זמין כרגע'}</div>
        </div>
        <button type="button" class="mini o" style="background:#FFFFFF;color:var(--bad);border:0" data-sos-clear="${esc(k)}">סגור התראה</button>
      </div>
      ${has ? `<div class="row">
        <a class="mini o" style="flex:1;background:#FFFFFF;color:#111111;border:0" href="https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes" target="_blank" rel="noopener noreferrer">Waze למיקום</a>
        <a class="mini o" style="flex:1;background:#FFFFFF;color:#111111;border:0" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener noreferrer">Google Maps</a>
      </div>` : ''}
    </div>`;
  }).join('');
}

function renderHome() {
  const t = S.trip;
  const nx = nextStop();
  const ms = Object.entries(S.members);
  const sharing = ms.filter(([id]) => S.locs[id]?.on);

  if (!t) {
    return `<div class="stack">
      <div class="between">
        <div>
          <div class="small">שלום, ${esc(S.members[S.uid]?.name)}</div>
          <h1 class="h1">הטיול המשפחתי</h1>
        </div>
        ${av(S.members[S.uid])}
      </div>
      <div class="card stack">
        <div class="h2">עדיין לא הוגדר טיול</div>
        <div class="sub">הגדר את שם הטיול, היעד והתאריכים כדי להתחיל לבנות את המסלול.</div>
        <button type="button" class="btn" id="open-trip-sheet">${svg('plus')} יצירת טיול חדש</button>
      </div>
    </div>`;
  }

  const cd = countdown(t);
  return `<div class="stack">
    <div class="between">
      <div>
        <div class="small">${esc(t.dest || 'טיול משפחתי')} ${cd ? '• ' + esc(cd) : ''}</div>
        <h1 class="h1">${esc(t.title)}</h1>
      </div>
      <button type="button" class="lnk" id="open-trip-sheet">ערוך</button>
    </div>

    ${nx ? `<section class="hero" aria-label="התחנה הבאה">
      <div class="between">
        <span style="font-size:14px;color:var(--mut)">התחנה הבאה • ${esc(nx.day.title || 'יום ' + nx.day.num)}</span>
        <span style="font-size:14px;color:var(--mut)">${esc(KIND_LABEL[nx.stop.kind] || '')}</span>
      </div>
      <div>
        ${nx.stop.time ? `<div class="big">${esc(nx.stop.time)}</div>` : ''}
        <div style="font-size:24px;font-weight:700;margin-top:6px">${esc(nx.stop.title)}</div>
        ${nx.stop.place ? `<div style="font-size:15px;color:var(--mut);margin-top:4px">${esc(nx.stop.place)}</div>` : ''}
      </div>
      <div class="row">
        <a class="hb hb1" href="${navUrl(nx.stop, 'waze')}" target="_blank" rel="noopener noreferrer">${svg('nav', 18)} נווט ב-Waze</a>
        <a class="hb hb2" href="${navUrl(nx.stop, 'google')}" target="_blank" rel="noopener noreferrer">Google Maps</a>
      </div>
    </section>` : `<div class="card stack-s">
      <div class="h2">אין תחנות מתוכננות עדיין</div>
      <div class="small">הוסף ימים ותחנות בלשונית המסלול.</div>
      <button type="button" class="btn2" data-tab="route">מעבר למסלול</button>
    </div>`}

    <div class="card stack-s">
      <div class="between">
        <div class="h2">מצא את המשפחה</div>
        <button type="button" class="lnk" data-tab="map">למפה החיה</button>
      </div>
      <div class="between">
        <div class="row" style="padding-inline-start:8px">${ms.map(([, m]) => av(m, true)).join('')}</div>
        <div class="small">${sharing.length} מתוך ${ms.length} משתפים מיקום</div>
      </div>
    </div>

    <div class="row">
      <button type="button" class="btn2" style="flex:1" data-tab="tickets">${svg('ticket', 18)} כרטיסים (${S.tickets.length})</button>
      <button type="button" class="btn2" style="flex:1" data-tab="trivia">טריוויה משפחתית</button>
    </div>
  </div>`;
}

function renderRoute() {
  const ds = sortedDays();
  return `<div class="stack">
    <div class="between">
      <div>
        <h1 class="h1">מסלול הטיול</h1>
        <div class="small">${ds.length} ימים • ${S.stops.length} תחנות</div>
      </div>
      <button type="button" class="btn" id="add-day-btn" style="min-height:44px;padding:0 14px">${svg('plus', 18)} יום</button>
    </div>
    ${!ds.length ? `<div class="card stack-s">
      <div class="h2">המסלול עדיין ריק</div>
      <div class="small">לחץ על ״+ יום״ כדי להוסיף את היום הראשון בטיול.</div>
    </div>` : `<div class="stack-s">
      ${ds.map(d => {
        const cnt = S.stops.filter(s => s.dayId === d.id).length;
        return `<button type="button" class="tab-link" data-open-day="${esc(d.id)}">
          <div>
            <div style="font-weight:700;font-size:17px">${esc(d.title || 'יום ' + d.num)}</div>
            <div class="small">${fmtDate(d.date)} ${d.note ? '• ' + esc(d.note) : ''}</div>
          </div>
          <div class="row">
            <span class="small">${cnt} תחנות</span>
            ${svg('chev', 18)}
          </div>
        </button>`;
      }).join('')}
    </div>`}
  </div>`;
}

function renderDay(dayId) {
  const d = S.days.find(x => x.id === dayId);
  if (!d) { S.day = null; return renderRoute(); }
  const allStops = sortedStops(dayId);
  const stops = S.filter === 'all' ? allStops : allStops.filter(s => s.kind === S.filter);

  return `<div class="stack">
    <div class="topbar">
      <button type="button" class="lnk" id="back-route">${svg('back', 18)} מסלול</button>
      <div style="font-weight:700">${esc(d.title || 'יום ' + d.num)}</div>
      <button type="button" class="lnk" data-edit-day="${esc(d.id)}">ערוך יום</button>
    </div>

    <div>
      <h1 class="h1">${esc(d.title || 'יום ' + d.num)}</h1>
      <div class="sub">${fmtDate(d.date)}</div>
      ${d.note ? `<div class="note" style="margin-top:10px">${esc(d.note)}</div>` : ''}
    </div>

    <div class="chips" role="tablist">
      <button type="button" class="chip ${S.filter === 'all' ? 'on' : ''}" data-filt="all">הכול (${allStops.length})</button>
      ${KINDS.map(([k, lbl]) => {
        const c = allStops.filter(s => s.kind === k).length;
        return `<button type="button" class="chip ${S.filter === k ? 'on' : ''}" data-filt="${k}">${lbl} (${c})</button>`;
      }).join('')}
    </div>

    <div class="stack-s">
      ${!stops.length ? `<div class="card small">אין תחנות להצגה בסינון זה.</div>` : stops.map(s => `<article class="card stack-s">
        <div class="between">

  const ms = Object.entries(S.members);
  const pinned = ms
    .map(([id, m]) => ({ id, m, l: S.locs[id] }))
    .filter(({ l }) => l && typeof l.lat === 'number' && typeof l.lng === 'number');

  const center = pinned.length ? [pinned[0].l.lat, pinned[0].l.lng] : [32.0853, 34.7818];
  const map = L.map('findmy-map', { zoomControl: true }).setView(center, pinned.length ? 14 : 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const bounds = [];
  pinned.forEach(({ id, m, l }) => {

      iconSize: [38, 38],
      iconAnchor: [19, 19]
    });
    const marker = L.marker([l.lat, l.lng], { icon }).addTo(map);
    const dist = id === S.uid ? 'המיקום שלך' : fmtDistFromMe(l);
    marker.bindPopup(`
      <div style="text-align:right;font-family:Heebo,sans-serif;min-width:150px">
        <div style="font-weight:700;font-size:15px">${esc(m?.name || 'בן משפחה')}</div>

          <a href="https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes" target="_blank" rel="noopener noreferrer" style="flex:1;background:#2563EB;color:#fff;padding:6px 8px;border-radius:8px;text-align:center;font-size:12px;font-weight:600">Waze</a>

function stopTriviaTimers() {
  if (tvInterval) { clearInterval(tvInterval); tvInterval = null; }
  if (tvAdvanceTimeout) { clearTimeout(tvAdvanceTimeout); tvAdvanceTimeout = null; }
}

function isTurnAnswered(g) {
  return g && typeof g.ans === 'number' && g.ans >= -1;
}

function getTriviaSecLeft(g) {
  if (!g) return QUESTION_SEC;
  if (g.status === 'paused') {
    return typeof g.pausedSecLeft === 'number' ? g.pausedSecLeft : QUESTION_SEC;
  }
  if (g.status !== 'play') return QUESTION_SEC;
  if (isTurnAnswered(g)) return 0;
  const elapsed = Math.floor((Date.now() - (g.turnStartedAt || Date.now())) / 1000);
  return Math.max(0, QUESTION_SEC - elapsed);
}

function buildNextTurnPatch(g) {
  const validOrder = (g.order || []).filter(id => S.members[id]);
  const pool = validOrder.length ? validOrder : Object.keys(S.members || {});
  const nextQ = (g.q || 0) + 1;
  if (nextQ >= ROUND || !pool.length) {
    return {
      ...g,
      status: 'done',
      ans: -2,
      advanceAt: 0
    };
  }
  const nextTurnIdx = ((g.turnIdx || 0) + 1) % pool.length;
  return {
    ...g,
    q: nextQ,
    turnIdx: nextTurnIdx,
    order: pool,
    activeUid: pool[nextTurnIdx],
    turnStartedAt: Date.now(),
    ans: -2,
    advanceAt: 0
  };
}

function startNewSharedGame(resetScores = false) {
  stopTriviaTimers();
  const order = Object.keys(S.members || {});
  if (!order.length) { toast('אין משתתפים בקבוצה'); return; }
  const round = (S.tvGame && typeof S.tvGame.round === 'number') ? S.tvGame.round + 1 : 0;
  const game = {
    status: 'play',
    round,
    q: 0,
    turnIdx: 0,
    order,
    activeUid: order[0],
    turnStartedAt: Date.now(),
    ans: -2,
    advanceAt: 0,
    lastResult: null,
    roundPts: {}
  };
  const patch = { triviaGame: game };
  if (resetScores) {
    const zeroScores = {};
    order.forEach(id => { zeroScores[id] = { pts: 0, ok: 0, tot: 0 }; });
    S.scores = zeroScores;
    patch.scores = zeroScores;
  }
  S.tvGame = game;
  syncRoom(patch);
  ensureSharedTimer();
  draw();
}

function pauseSharedGame() {
  const g = S.tvGame;
  if (!g || g.status !== 'play') return;
  stopTriviaTimers();
  const secLeft = getTriviaSecLeft(g);
  const pausedGame = {
    ...g,
    status: 'paused',
    pausedSecLeft: secLeft,
    ans: -2,
    advanceAt: 0
  };
  S.tvGame = pausedGame;
  syncRoom({ triviaGame: pausedGame });
  toast('המשחק הושהה — ניתן להמשיך מאותה נקודה');
  draw();
}

function resumeSharedGame() {
  const g = S.tvGame;
  if (!g || g.status !== 'paused') return;
  const validOrder = (g.order || []).filter(id => S.members[id]);
  const pool = validOrder.length ? validOrder : Object.keys(S.members || {});
  if (!pool.length) { toast('אין משתתפים בקבוצה'); return; }
  const activeUid = S.members[g.activeUid] ? g.activeUid : pool[0];
  const secLeft = (typeof g.pausedSecLeft === 'number' && g.pausedSecLeft > 0) ? g.pausedSecLeft : QUESTION_SEC;
  const resumedGame = {
    ...g,
    status: 'play',
    order: pool,
    activeUid,
    turnStartedAt: Date.now() - ((QUESTION_SEC - secLeft) * 1000),
    pausedSecLeft: null,
    ans: -2,
    advanceAt: 0
  };
  S.tvGame = resumedGame;
  syncRoom({ triviaGame: resumedGame });
  ensureSharedTimer();
  toast('המשחק ממשיך מאיפה שעצרנו!');
  draw();
}

let advancingTrivia = false;
function ensureSharedTimer() {
  const g = S.tvGame;
  if (!g || g.status !== 'play') {
    stopTriviaTimers();
    return;
  }
  if (!tvInterval) {
    tvInterval = setInterval(() => {
      const cur = S.tvGame;
      if (!cur || cur.status !== 'play') { stopTriviaTimers(); return; }

      // 1) If wrong/timeout answer is waiting to advance, advance once advanceAt is reached
      if (isTurnAnswered(cur) && cur.advanceAt && Date.now() >= cur.advanceAt && !advancingTrivia) {
        advancingTrivia = true;
        const nextGame = buildNextTurnPatch(cur);
        S.tvGame = nextGame;
        syncRoom({ triviaGame: nextGame }).finally(() => { advancingTrivia = false; });
        draw();
        return;
      }

      // 2) If unanswered and 35s elapsed, trigger timeout
      const left = getTriviaSecLeft(cur);
      if (left <= 0 && !isTurnAnswered(cur)) {
        if (cur.activeUid === S.uid || isGroupAdmin()) {
          submitSharedAnswer(-1, true);
        }
      }

      if (S.tab === 'trivia') draw();
    }, 300);
  }
}

let localAnswerLockQ = -1;
function submitSharedAnswer(chosenOrigIdx, isTimeout = false) {
  const g = S.tvGame;
  if (!g || g.status !== 'play') return;
  if (isTurnAnswered(g)) return;
  if (!isTimeout && g.activeUid !== S.uid) {
    toast('המתן לתור שלך');
    return;
  }
  // Strict single-attempt lock per question turn
  const turnKey = `${g.round || 0}_${g.q || 0}_${g.activeUid}`;
  if (localAnswerLockQ === turnKey) return;
  localAnswerLockQ = turnKey;

  const activeId = g.activeUid;
  const qi = qIndex({ round: g.round || 0, q: g.q || 0 }, S.trip?.id || 'family');
  const q = TQ[qi];
  const isOk = !isTimeout && chosenOrigIdx === q.a;
  const activeName = S.members[activeId]?.name || 'שחקן';

  const prev = S.scores[activeId] || { pts: 0, ok: 0, tot: 0 };
  const nextScore = isOk
    ? { pts: (prev.pts || 0) + 10, ok: (prev.ok || 0) + 1, tot: (prev.tot || 0) + 1 }
    : { pts: prev.pts || 0, ok: prev.ok || 0, tot: (prev.tot || 0) + 1 };

  const roundPts = { ...(g.roundPts || {}) };
  if (isOk) roundPts[activeId] = (roundPts[activeId] || 0) + 10;

  const lastResult = {
    uid: activeId,
    name: activeName,
    ok: isOk,
    timeout: isTimeout,
    at: Date.now()
  };

  // Correct answer -> advance IMMEDIATELY to next question & next player!
  if (isOk) {
    const nextGame = buildNextTurnPatch({
      ...g,
      roundPts,
      lastResult
    });
    S.tvGame = nextGame;
    S.scores[activeId] = nextScore;
    syncRoom({
      triviaGame: nextGame,
      [`scores/${activeId}`]: nextScore
    });
    toast(`נכון! +10 נק׳ ל-${activeName}`);
    draw();
    return;
  }

  // Wrong answer or timeout -> NO second attempt! Lock answer immediately, show result briefly (1.4s), then pass turn to next user
  const updatedGame = {
    ...g,
    ans: chosenOrigIdx,
    advanceAt: Date.now() + 1400,
    roundPts,
    lastResult
  };
  S.tvGame = updatedGame;
  S.scores[activeId] = nextScore;
  syncRoom({
    triviaGame: updatedGame,
    [`scores/${activeId}`]: nextScore
  });
  draw();
}

    const qi = qIndex({ round: g.round || 0, q: g.q || 0 }, S.trip?.id || 'family');
    const q = TQ[qi];
    const order = optOrder(qi);
    const secLeft = getTriviaSecLeft(g);
    const pct = Math.max(0, Math.min(100, (secLeft / QUESTION_SEC) * 100));
    const isMyTurn = g.activeUid === S.uid;

    const answered = isTurnAnswered(g);

    return `<div class="stack">

            <div class="small">${isMyTurn ? 'בחר תשובה לפני שייגמרו 35 השניות' : 'צופה בשאלה בזמן אמת • התור הבא יתחלף אוטומטית'}</div>
            ${g.lastResult && (Date.now() - g.lastResult.at < 3500) && g.lastResult.ok ? `<div style="font-size:13px;color:var(--acc);font-weight:600;margin-top:2px">✓ תשובה נכונה של ${esc(g.lastResult.name || '')} (+10 נק׳)</div>` : ''}
          </div>
        </div>
      </div>

      <div class="card stack">
        <div class="small">${esc(q.cat)}</div>
        <div class="h2" style="font-size:22px;line-height:1.35">${esc(q.q)}</div>
        <div class="stack-s">
          ${order.map(origIdx => {
            let cls = 'opt';
            if (answered) {
              if (origIdx === q.a) cls += ' ok';
              else if (origIdx === g.ans) cls += ' no';
            }
            const disabled = answered || !isMyTurn;
            return `<button type="button" class="${cls}" data-ans="${origIdx}" ${disabled ? 'disabled' : ''}>
              <span>${esc(q.o[origIdx])}</span>
            </button>`;
          }).join('')}
        </div>
        ${answered ? `<div class="${g.lastResult?.ok ? 'note' : 'warn'}">
          ${g.lastResult?.timeout
            ? `נגמר הזמן של ${esc(activeMember.name)}! התור עובר לשחקן הבא...`
            : g.lastResult?.ok
              ? `תשובה נכונה! +10 נק׳ ל-${esc(activeMember.name)}. התור עובר לשחקן הבא...`
              : `תשובה שגויה של ${esc(activeMember.name)} (אין ניסיון נוסף). התור עובר לשחקן הבא...`}
        </div>` : ''}
      </div>

      <div class="card stack-s">
        <div class="between">
          <div class="h2">טבלת תחרות חיה</div>
          ${admin ? `<button type="button" class="lnk" id="tv-reset-scores" style="color:var(--bad)">אפס משחק (מנהל)</button>` : ''}
        </div>
        ${board.map((b, idx) => `<div class="between">
          <div class="row">${av(b.m)} <span>${idx + 1}. ${esc(b.m.name)} ${b.id === g.activeUid ? '• בתור' : ''}</span></div>
          <strong>${b.sc.pts} נק׳ (${b.sc.ok || 0}/${b.sc.tot || 0})</strong>
        </div>`).join('')}
      </div>
    </div>`;
  }

  if (g && g.status === 'paused') {
    const activeMember = S.members[g.activeUid] || { name: 'שחקן', color: 0 };
    const secLeft = getTriviaSecLeft(g);
    return `<div class="stack">
      <div class="topbar">
        <button type="button" class="lnk" data-tab="more">${svg('back', 18)} עוד</button>
        <div style="font-weight:700">המשחק מושהה</div>
        <span></span>
      </div>
      <div class="card stack">
        <div class="h2">משחק מושהה — שאלה ${(g.q || 0) + 1} מתוך ${ROUND}</div>
        <div class="small">עצרנו בתור של <strong>${esc(activeMember.name)}</strong> (${secLeft} שניות נותרו).</div>
        <button type="button" class="btn" id="tv-resume">המשך מאיפה שעצרנו</button>
        ${admin ? `<button type="button" class="btn2 danger" id="tv-reset-scores">עצור ואפס משחק לגמרי (קוד מנהל)</button>` : `<div class="small">רק מנהל הקבוצה יכול לעצור ולאפס משחק לגמרי.</div>`}
      </div>
      <div class="card stack-s">
        <div class="h2">טבלת תחרות נוכחית</div>
        ${board.map((b, idx) => `<div class="between">
          <div class="row">${av(b.m)} <span>${idx + 1}. ${esc(b.m.name)}</span></div>
          <strong>${b.sc.pts} נק׳ (${b.sc.ok || 0}/${b.sc.tot || 0})</strong>
        </div>`).join('')}
      </div>
    </div>`;
  }

  if (g && g.status === 'done') {
    const winner = board[0];
    return `<div class="stack">
      <div class="topbar">
        <button type="button" class="lnk" data-tab="more">${svg('back', 18)} עוד</button>
        <div style="font-weight:700">סיום סיבוב משותף</div>
        <span></span>
      </div>
      <div class="card stack" style="text-align:center">
        <h1 class="h1">${winner ? `המנצח: ${esc(winner.m.name)}!` : 'הסיבוב הסתיים!'}</h1>
        <div class="sub">כל השחקנים שיחקו בתורות של 35 שניות לשאלה.</div>
        <button type="button" class="btn" id="tv-next-round">סיבוב חדש (ממשיך ניקוד מצטבר)</button>
        ${admin ? `<button type="button" class="btn2 danger" id="tv-reset-scores">אפס משחק וניקוד לגמרי (קוד מנהל)</button>` : ''}
      </div>
      <div class="card stack-s">
        <div class="h2">טבלת המובילים</div>
        ${board.map((b, idx) => `<div class="between">
          <div class="row">${av(b.m)} <span>${idx + 1}. ${esc(b.m.name)}</span></div>
          <strong>${b.sc.pts} נק׳ (${b.sc.ok || 0}/${b.sc.tot || 0})</strong>
        </div>`).join('')}

  }

  return `<div class="stack">
    <div class="topbar">

document.addEventListener('input', e => {
  if (e.target.id === 'ob-name') {
    S.ob.name = e.target.value;
    const b = $('#ob-next0');
    if (b) b.disabled = !S.ob.name.trim();
  }
});

document.addEventListener('click', e => {
  const focusCard = e.target.closest('[data-focus-member]');
  if (focusCard && !e.target.closest('a, button')) {
    const mid = focusCard.dataset.focusMember;
    const l = S.locs[mid];
    if (l && typeof l.lat === 'number' && typeof l.lng === 'number') {
      S.selectedMember = mid;
      if (findMyMap) {
        findMyMap.setView([l.lat, l.lng], 16);
        if (findMyMarkers[mid]) findMyMarkers[mid].openPopup();
      }
      draw();
    }
    return;
  }

  const el = e.target.closest('button, a');
  if (!el) return;

  if (el.id === 'sh-ov' || el.id === 'sh-close') { closeSheet(); return; }

  if (el.dataset.obCol !== undefined) { S.ob.color = Number(el.dataset.obCol); draw(); return; }
  if (el.id === 'ob-next0') { if (S.ob.name.trim()) { S.ob.step = 1; draw(); } return; }
  if (el.id === 'ob-loc-yes') { S.ob.loc = 'yes'; startLocWatch(false); S.ob.step = 2; draw(); return; }
  if (el.id === 'ob-loc-no') { S.ob.loc = 'no'; S.ob.step = 2; draw(); return; }
  if (el.id === 'ob-done') {
    const cleanName = S.ob.name.trim() || 'בן משפחה';
    const existingId = findExistingMemberByName(S.members, cleanName);
    if (existingId && existingId !== S.uid) {
      // Unify device with the existing single profile (e.g. ERIC / eric)
      const oldUid = S.uid;
      S.uid = existingId;
      uid = existingId;
      localStorage.setItem(LOCAL_USER_KEY, existingId);
      localStorage.setItem(LOCAL_LOCK_KEY, '1');
      localStorage.setItem(LOCAL_NAME_KEY, S.members[existingId].name || cleanName);
      const patch = {};
      if (S.locs[oldUid]) {
        S.locs[existingId] = S.locs[oldUid];
        delete S.locs[oldUid];
        patch[`locs/${existingId}`] = S.locs[existingId];
        patch[`locs/${oldUid}`] = null;
      }
      if (isEricName(cleanName) && S.trip) {
        S.trip.adminUid = existingId;
        patch['trip/adminUid'] = existingId;
      }
      if (Object.keys(patch).length) syncRoom(patch);
      toast(`חוברת לפרופיל הקיים: ${S.members[existingId].name}`);
      S.resetScroll = true;
      draw();
      return;
    }
    const alreadyLocked = localStorage.getItem(LOCAL_LOCK_KEY) === '1';
    if (alreadyLocked && S.members[S.uid]) {
      toast('כבר קיים פרופיל עבור מכשיר זה — ניתן לערוך אותו מתוך לשונית עוד');
      S.resetScroll = true;
      draw();
      return;
    }
    const memberObj = { name: cleanName, color: S.ob.color, createdAt: Date.now() };
    S.members[S.uid] = memberObj;
    localStorage.setItem(LOCAL_LOCK_KEY, '1');
    localStorage.setItem(LOCAL_NAME_KEY, cleanName);
    const patch = { [`members/${S.uid}`]: memberObj };
    if (isEricName(cleanName) || (!S.trip?.adminUid && Object.keys(S.members).length === 1)) {
      if (S.trip) S.trip.adminUid = S.uid;
      patch['trip/adminUid'] = S.uid;
    }
    syncRoom(patch);
    S.resetScroll = true;
    draw();
    return;
  }

  if (el.dataset.tab) {
    stopTriviaTimers();
    S.tab = el.dataset.tab;
    S.day = null;
    S.resetScroll = true;
    draw();
    return;
  }

  if (el.id === 'open-trip-sheet' || el.id === 'open-trip-sheet-2') { showTripSheet(); return; }
  if (el.id === 'save-trip') {
    const title = $('#f-t-title').value.trim();
    if (!title) { toast('נא להזין שם לטיול'); return; }
    const tripObj = {
      id: S.trip?.id || newId(),
      title,
      dest: $('#f-t-dest').value.trim(),
      start: $('#f-t-start').value,
      end: $('#f-t-end').value
    };
    S.trip = tripObj;
    syncRoom({ trip: tripObj });
    closeSheet();
    draw();
    toast('פרטי הטיול נשמרו');
    return;
  }

  if (el.id === 'add-day-btn') { showDaySheet(null); return; }
  if (el.dataset.openDay) { S.day = el.dataset.openDay; S.filter = 'all'; S.resetScroll = true; draw(); return; }
  if (el.id === 'back-route') { S.day = null; S.resetScroll = true; draw(); return; }
  if (el.dataset.editDay) { showDaySheet(el.dataset.editDay); return; }
  if (el.id === 'save-day') {
    const id = el.dataset.id;
    const title = $('#f-d-title').value.trim() || 'יום בטיול';
    const date = $('#f-d-date').value;
    const note = $('#f-d-note').value.trim();
    if (id) {
      const d = S.days.find(x => x.id === id);
      if (d) Object.assign(d, { title, date, note });
    } else {
      S.days.push({ id: newId(), num: S.days.length + 1, title, date, note });
    }
    syncRoom({ days: S.days });
    closeSheet();
    draw();
    toast('היום נשמר');
    return;
  }
  if (el.id === 'del-day') {
    const id = el.dataset.id;
    S.days = S.days.filter(x => x.id !== id);
    S.stops = S.stops.filter(x => x.dayId !== id);
    if (S.day === id) S.day = null;
    syncRoom({ days: S.days, stops: S.stops });
    closeSheet();
    draw();
    toast('היום נמחק');
    return;
  }

  if (el.dataset.filt) { S.filter = el.dataset.filt; draw(); return; }
  if (el.id === 'add-stop-btn') { showStopSheet(null); return; }
  if (el.dataset.editStop) { showStopSheet(el.dataset.editStop); return; }
  if (el.id === 'save-stop') {
    const id = el.dataset.id;
    const title = $('#f-s-title').value.trim();
    if (!title) { toast('נא להזין שם לתחנה'); return; }
    const payload = {
      title,
      time: $('#f-s-time').value,
      kind: $('#f-s-kind').value,
      place: $('#f-s-place').value.trim(),
      note: $('#f-s-note').value.trim()
    };
    if (id) {
      const s = S.stops.find(x => x.id === id);
      if (s) Object.assign(s, payload);
    } else {
      S.stops.push({ id: newId(), dayId: S.day, order: S.stops.length, ...payload });
    }
    syncRoom({ stops: S.stops });
    closeSheet();
    draw();
    toast('התחנה נשמרה');
    return;
  }
  if (el.id === 'del-stop') {
    const id = el.dataset.id;
    S.stops = S.stops.filter(x => x.id !== id);
    syncRoom({ stops: S.stops });
    closeSheet();
    draw();
    toast('התחנה נמחקה');
    return;
  }

  if (el.dataset.mm) { S.mapMode = el.dataset.mm; draw(); return; }
  if (el.id === 'fm-fit-all') { S.selectedMember = null; draw(); return; }
  if (el.dataset.cat) { S.cat = el.dataset.cat; draw(); return; }
  if (el.id === 'toggle-loc') {
    if (S.locs[S.uid]?.on) stopLocWatch();
    else startLocWatch(false);
    return;
  }

  if (el.id === 'add-ticket-btn') { showTicketSheet(null); return; }
  if (el.dataset.editTicket) { showTicketSheet(el.dataset.editTicket); return; }
  if (el.id === 'save-ticket') {
    const id = el.dataset.id;
    const title = $('#f-k-title').value.trim();
    if (!title) { toast('נא להזין כותרת לכרטיס'); return; }
    const payload = {
      title,
      kind: $('#f-k-kind').value,
      when: $('#f-k-when').value.trim(),
      code: $('#f-k-code').value.trim(),
      link: $('#f-k-link').value.trim(),
      note: $('#f-k-note').value.trim()
    };
    if (id) {
      const t = S.tickets.find(x => x.id === id);
      if (t) Object.assign(t, payload);
    } else {
      S.tickets.push({ id: newId(), ...payload });
    }
    syncRoom({ tickets: S.tickets });
    closeSheet();
    draw();
    toast('הכרטיס נשמר');
    return;
  }
  if (el.id === 'del-ticket') {
    const id = el.dataset.id;
    S.tickets = S.tickets.filter(x => x.id !== id);
    syncRoom({ tickets: S.tickets });
    closeSheet();
    draw();
    toast('הכרטיס נמחק');
    return;
  }
  if (el.dataset.copy) {
    navigator.clipboard?.writeText(el.dataset.copy);
    toast('הקוד הועתק');
    return;
  }

  if (el.id === 'tv-start' || el.id === 'tv-next-round') { startNewSharedGame(false); return; }
  if (el.id === 'tv-resume') { resumeSharedGame(); return; }
  if (el.id === 'tv-pause') { pauseSharedGame(); return; }
  if (el.id === 'tv-reset-scores') { showAdminResetSheet(); return; }
  if (el.id === 'confirm-admin-reset') { executeAdminReset($('#f-reset-code')?.value); return; }
  if (el.dataset.ans !== undefined) { submitSharedAnswer(Number(el.dataset.ans), false); return; }

  if (el.id === 'edit-profile') { showProfileSheet(); return; }
  if (el.dataset.pCol !== undefined) {
    const col = Number(el.dataset.pCol);
    const btn = $('#save-profile');
    if (btn) btn.dataset.col = col;
    document.querySelectorAll('[data-p-col]').forEach((b, i) => {
      b.style.border = i === col ? '3px solid var(--acc)' : '1.5px solid var(--field)';
    });
    return;
  }
  if (el.id === 'save-profile') {
    const name = $('#f-p-name').value.trim();
    if (!name) { toast('נא להזין שם'); return; }
    const col = Number(el.dataset.col || 0);
    const memberObj = { ...(S.members[S.uid] || {}), name, color: col };
    S.members[S.uid] = memberObj;
    localStorage.setItem(LOCAL_NAME_KEY, name);
    const patch = { [`members/${S.uid}`]: memberObj };
    if (isEricName(name) && S.trip) {
      S.trip.adminUid = S.uid;
      patch['trip/adminUid'] = S.uid;
    }
    syncRoom(patch);
    closeSheet();
    draw();
    toast('הפרופיל עודכן');
    return;
  }

  if (el.id === 'sos-trigger') { S.sosAsk = true; draw(); return; }
  if (el.id === 'sos-cancel') { S.sosAsk = false; draw(); return; }
  if (el.id === 'sos-confirm') {
    S.sosAsk = false;
    const sosObj = { active: true, at: Date.now(), name: S.members[S.uid]?.name || '' };
    S.sos[S.uid] = sosObj;
    startLocWatch(true);
    syncRoom({ [`sos/${S.uid}`]: sosObj });
    draw();
    toast('התראת SOS נשלחה למשפחה');
    return;
  }
  if (el.dataset.delMember) {
    if (!isGroupAdmin()) { toast('רק מנהל הקבוצה יכול למחוק משתמש'); return; }
    const targetId = el.dataset.delMember;
    if (targetId === S.uid) { toast('לא ניתן למחוק את הפרופיל שלך מכאן'); return; }
    const targetName = el.dataset.delName || 'המשתמש';
    delete S.members[targetId];
    delete S.locs[targetId];
    delete S.scores[targetId];
    delete S.sos[targetId];
    if (S.selectedMember === targetId) S.selectedMember = null;
    syncRoom({
      [`members/${targetId}`]: null,
      [`locs/${targetId}`]: null,
      [`scores/${targetId}`]: null,
      [`sos/${targetId}`]: null,
      [`prog/${targetId}`]: null
    });
    draw();
    toast(`המשתמש ${targetName} נמחק מהקבוצה`);
    return;
  }

  if (el.id === 'backup-download') {
    const payload = {
      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      trip: S.trip || null,
      days: S.days || [],
      stops: S.stops || [],
      tickets: S.tickets || [],
      members: S.members || {},
      scores: S.scores || {}
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateTag = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `tripapp-backup-${APP_VERSION}-${dateTag}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`קובץ גיבוי (${APP_VERSION}) ירד לטלפון`);
    return;
  }

  if (el.id === 'backup-restore-btn') {
    const inp = $('#backup-file-input');
    if (inp) { inp.value = ''; inp.click(); }
    return;
  }

  if (el.dataset.sosClear) {
    const k = el.dataset.sosClear;
    delete S.sos[k];
    syncRoom({ [`sos/${k}`]: null });
    draw();
    toast('התראת ה-SOS נסגרה');
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'backup-file-input') {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || '{}'));
        if (!data || typeof data !== 'object' || (!data.trip && !Array.isArray(data.days) && !data.members)) {
          toast('קובץ הגיבוי אינו תקין');
          return;
        }
        const patch = {};
        if ('trip' in data) { S.trip = data.trip || null; patch.trip = S.trip; }
        if (Array.isArray(data.days)) { S.days = data.days; patch.days = S.days; }
        if (Array.isArray(data.stops)) { S.stops = data.stops; patch.stops = S.stops; }
        if (Array.isArray(data.tickets)) { S.tickets = data.tickets; patch.tickets = S.tickets; }
        if (data.members && typeof data.members === 'object') {
          S.members = { ...S.members, ...data.members };
          patch.members = S.members;
        }
        if (data.scores && typeof data.scores === 'object') {
          S.scores = { ...S.scores, ...data.scores };
          patch.scores = S.scores;
        }
        syncRoom(patch);
        draw();
        toast(`הגיבוי שוחזר בהצלחה${data.appVersion ? ' (' + data.appVersion + ')' : ''}`);
      } catch (err) {
        toast('שגיאה בקריאת קובץ הגיבוי');
      }
    };
    reader.readAsText(file);
  }
});

render();
</script>
</body>
</html>
